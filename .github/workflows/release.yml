name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  android-ui-mobile:
    name: Compose UI tests (mobile, API 34)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        # Without this the runner user isn't in the kvm group, the action's
        # `disable-linux-hw-accel: auto` probe fails ("ProbeKVM: This user
        # doesn't have permissions to use KVM"), and the emulator is launched
        # with `-accel off`. Fully software-emulated x86 is what made the TV
        # emulator fail to boot at all and made the mobile job take ~57min for
        # 32 tests.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-mobile
      - name: Provide dummy google-services.json
        run: |
          for d in mobile tv; do
            cp .github/workflows/google-services.stub.json "$d/google-services.json" || true
          done
      - name: Run mobile androidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: google_apis
          script: ./gradlew :mobile:connectedDebugAndroidTest

  android-ui-tv:
    name: Compose UI tests (TV, API 34)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        # Without this the runner user isn't in the kvm group, the action's
        # `disable-linux-hw-accel: auto` probe fails ("ProbeKVM: This user
        # doesn't have permissions to use KVM"), and the emulator is launched
        # with `-accel off`. Fully software-emulated x86 is what made the TV
        # emulator fail to boot at all and made the mobile job take ~57min for
        # 32 tests.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Keyed to the image the AVD is built from: an AVD restored from a
          # cache made with a different system image silently defeats the
          # target/arch settings below.
          key: avd-34-tv-androidtv-x86
      - name: Provide dummy google-services.json
        run: |
          for d in mobile tv; do
            cp .github/workflows/google-services.stub.json "$d/google-services.json" || true
          done
      - name: Run tv androidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # A tv_1080p device profile booted against a phone system image
          # (google_apis) is an incoherent AVD: it came up with GPU
          # "Failed to find ColorBuffer" errors and killed the instrumentation
          # before a single test was collected ("Starting 0 tests" ->
          # "Process crashed"), which is why this job had never once gone
          # green. Match the profile with an actual TV image. Note the arch:
          # android-tv publishes x86 only at API 34 -- there is no x86_64
          # TV image until API 36.
          arch: x86
          profile: tv_1080p
          target: android-tv
          script: ./gradlew :tv:connectedDebugAndroidTest
