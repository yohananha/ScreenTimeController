<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I6c · Rules (phone)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:Rubik, system-ui, sans-serif;background:#FFF6EE}
a{color:#2A1E2E}a:hover{color:#6E5F66}
button{font-family:inherit;cursor:pointer}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(18,168,122,0.45)}70%{box-shadow:0 0 0 8px rgba(18,168,122,0)}100%{box-shadow:0 0 0 0 rgba(18,168,122,0)}}
.live{animation:livePulse 2s ease-out infinite}
@keyframes waitPulse{0%{transform:scale(1);opacity:.7}50%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:.7}}
.waiting{animation:waitPulse 1.8s ease-in-out infinite}
</style>
</head>
<body style="display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;box-sizing:border-box;background:#E9E1DA;">
<div dir="ltr" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFF6EE; color: #2A1E2E; font-family: Rubik, system-ui, sans-serif; display: flex; flex-direction: column;">
<div style="position: absolute; top: -220px; left: -160px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,176,136,0.24), rgba(255,255,255,0)); pointer-events: none;"></div>
  <div style="position: absolute; top: -120px; right: -220px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(247,154,192,0.20), rgba(255,255,255,0)); pointer-events: none;"></div>

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; padding: 56px 22px 0; box-sizing: border-box;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 18px;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-weight: 600; font-size: 30px; line-height: 1; letter-spacing: -0.03em; color: #2A1E2E;">Rules</span>
        <span style="font-size: 13px; font-weight: 500; color: #6E5F66;">What the TV is allowed to do</span>
      </div>
      <button aria-label="Family" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: #2A1E2E; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Y</button>
    </div>

    <div style="display: flex; flex-direction: column; padding: 4px 16px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(42,30,46,0.04), 0 8px 24px rgba(42,30,46,0.06);">
      <button style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 60px; padding: 10px 0; border: 0; background: transparent; color: #2A1E2E; text-align: start; border-top: 0;">
        <span style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 16px; font-weight: 600;">Overall daily limit</span>
          <span style="font-size: 13px; font-weight: 500; color: #6E5F66;">4h per day</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9A9B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 60px; padding: 10px 0; border: 0; background: transparent; color: #2A1E2E; text-align: start; border-top: 1px solid #F0E3D8;">
        <span style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 16px; font-weight: 600;">Allowed hours</span>
          <span style="font-size: 13px; font-weight: 500; color: #6E5F66;">Schedule on · 16:00–20:00 on weekdays</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9A9B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 60px; padding: 10px 0; border: 0; background: transparent; color: #2A1E2E; text-align: start; border-top: 1px solid #F0E3D8;">
        <span style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 16px; font-weight: 600;">Code lockout</span>
          <span style="font-size: 13px; font-weight: 500; color: #6E5F66;">5 wrong codes → 10 min lock</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9A9B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; margin-top: 24px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px;">
        <span style="font-weight: 600; font-size: 18px; letter-spacing: -0.01em; color: #2A1E2E;">App limits</span>
        <a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none;">+ Add</a>
      </div>
      <div style="display: flex; flex-direction: column; padding: 0 16px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(42,30,46,0.04), 0 8px 24px rgba(42,30,46,0.06);">
      <button style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; height: 52px; padding: 0; border: 0; background: transparent; color: #2A1E2E; text-align: start; border-top: 0;">
        <span style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600;"><span style="width: 10px; height: 10px; border-radius: 3px; background: #B3261E;"></span>YouTube</span>
        <span style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #6E5F66;">1h per day<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9A9B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg></span>
      </button>
      <button style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; height: 52px; padding: 0; border: 0; background: transparent; color: #2A1E2E; text-align: start; border-top: 1px solid #F0E3D8;">
        <span style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600;"><span style="width: 10px; height: 10px; border-radius: 3px; background: #2A1E2E;"></span>Netflix</span>
        <span style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #6E5F66;">1h 30m per day<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9A9B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg></span>
      </button>
      <button style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; height: 52px; padding: 0; border: 0; background: transparent; color: #2A1E2E; text-align: start; border-top: 1px solid #F0E3D8;">
        <span style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600;"><span style="width: 10px; height: 10px; border-radius: 3px; background: #12A87A;"></span>Minecraft</span>
        <span style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #6E5F66;">1h per day<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9A9B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg></span>
      </button>
      <button style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; height: 52px; padding: 0; border: 0; background: transparent; color: #2A1E2E; text-align: start; border-top: 1px solid #F0E3D8;">
        <span style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600;"><span style="width: 10px; height: 10px; border-radius: 3px; background: #FFB088;"></span>Disney+</span>
        <span style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #6E5F66;">Always allowed<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9A9B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg></span>
      </button>
      </div>
    </div>
  </div>
  <nav style="position: relative; display: flex; align-items: center; gap: 6px; margin: 0 22px 24px; padding: 6px; border-radius: 999px; background: #2A1E2E; box-shadow: 0 14px 32px rgba(42,30,46,0.25);">
    <button style="flex-grow: 1; height: 46px; border-radius: 999px; border: 0; background: transparent; color: #B9A9B5; font-size: 13px; font-weight: 500;">Today</button>
    <button aria-current="page" style="flex-grow: 1; height: 46px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.12); color: #FFFFFF; font-size: 13px; font-weight: 600;">Rules</button>
    <button style="flex-grow: 1; height: 46px; border-radius: 999px; border: 0; background: transparent; color: #B9A9B5; font-size: 13px; font-weight: 500;">Family</button>
    <button aria-label="Unlock code" style="width: 46px; height: 46px; border-radius: 50%; border: 0; background: #FFB088; color: #2A1E2E; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg></button>
  </nav>
</div>
</body>
</html>
