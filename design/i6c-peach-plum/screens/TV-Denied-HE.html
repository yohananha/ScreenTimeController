<!doctype html>

<style>
body{margin:0;font-family:Rubik, system-ui, sans-serif;background:#1E1622}
a{color:#2A1E2E}a:hover{color:#6E5F66}

@keyframes waitPulse{0%{transform:scale(1);opacity:.7}50%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:.7}}
.waiting{animation:waitPulse 1.8s ease-in-out infinite}

<body style="display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;box-sizing:border-box;background:#E9E1DA;">

  <div style="position: absolute; bottom: -520px; right: -320px; width: 1200px; height: 1200px; border-radius: 50%; background: radial-gradient(closest-side, rgba(247,154,192,0.14), rgba(30,22,34,0)); pointer-events: none;"></div>

<span style="width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 18px rgba(255,255,255,0.06);"><svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#FFF6EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9 10h.01M15 10h.01M15.5 15.5a4.5 4.5 0 0 0-7 0"></path></svg></span>
<h1 style="margin: 0; font-weight: 600; font-size: 128px; line-height: 1.02; letter-spacing: -0.03em; color: #FFF6EE;">לא עכשיו</h1>
<p style="margin: 0; font-size: 36px; line-height: 1.4; font-weight: 400; color: #B9A9B5; max-width: 1000px;">ההורה אמר אולי אחר כך — וזה בסדר. תמיד יש מחר.</p>
<div style="display: flex; align-items: center; gap: 36px; margin-top: 12px;"><button style="height: 92px; padding: 0 48px; border-radius: 999px; border: 3px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: #FFF6EE; font-size: 32px; font-weight: 500;">להקליד קוד</button><button style="height: 92px; padding: 0 56px; border-radius: 999px; border: 0; background: #FFF6EE; color: #1E1622; font-size: 32px; font-weight: 600; box-shadow: 0 0 0 6px #1E1622, 0 0 0 12px #FFB088; transform: scale(1.04);">בסדר</button></div>
  </div>
